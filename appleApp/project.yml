name: FlareDo

options:
  minimumXcodeGenVersion: 2.45.4
  developmentLanguage: en
  defaultConfig: Release
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Version.xcconfig
  Release: Version.xcconfig

settingGroups:
  application:
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_PREVIEWS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    OTHER_LDFLAGS: "$(inherited) -lsqlite3"
    PRODUCT_BUNDLE_IDENTIFIER: io.github.zhongjianhui.flaredo
    PRODUCT_NAME: FlareDo

settings:
  base:
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    DEAD_CODE_STRIPPING: YES
    "EXCLUDED_ARCHS[sdk=macosx*]": x86_64
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    SWIFT_VERSION: "6.3"
  configs:
    Debug:
      KOTLIN_FRAMEWORK_VARIANT: debugFramework
    Release:
      KOTLIN_FRAMEWORK_VARIANT: releaseFramework
      VALIDATE_PRODUCT: YES

targetTemplates:
  KotlinSharedApplication:
    preBuildScripts:
      - name: Compile KotlinSharedUI
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          case "${CONFIGURATION:-}" in
            Debug) KOTLIN_BUILD_TYPE=Debug ;;
            Release) KOTLIN_BUILD_TYPE=Release ;;
            *)
              echo "Unsupported Xcode configuration: ${CONFIGURATION:-unset}" >&2
              exit 1
              ;;
          esac
          case "${SDK_NAME:-}" in
            iphoneos*) KOTLIN_TARGET=IosArm64 ;;
            iphonesimulator*) KOTLIN_TARGET=IosSimulatorArm64 ;;
            macosx*) KOTLIN_TARGET=MacosArm64 ;;
            *)
              echo "Unsupported Apple SDK: ${SDK_NAME:-unset}" >&2
              exit 1
              ;;
          esac
          KOTLIN_LINK_TASK=":apple-shared:link${KOTLIN_BUILD_TYPE}Framework${KOTLIN_TARGET}"
          if [ -n "${GRADLE_JVM_ARGS:-}" ]; then
            ./gradlew \
              "-Dorg.gradle.jvmargs=$GRADLE_JVM_ARGS" \
              "$KOTLIN_LINK_TASK"
          else
            ./gradlew "$KOTLIN_LINK_TASK"
          fi
    settings:
      groups:
        - application

targets:
  iOS:
    templates: [KotlinSharedApplication]
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: ios
        excludes:
          - .DS_Store
          - Info.plist
    settings:
      base:
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]":
          - "$(inherited)"
          - "$(SRCROOT)/../apple-shared/build/bin/iosArm64/$(KOTLIN_FRAMEWORK_VARIANT)"
        "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]":
          - "$(inherited)"
          - "$(SRCROOT)/../apple-shared/build/bin/iosSimulatorArm64/$(KOTLIN_FRAMEWORK_VARIANT)"
        INFOPLIST_FILE: ios/Info.plist
        OTHER_LDFLAGS: "$(inherited) -lsqlite3 -ObjC -framework KotlinSharedUI"

  macOS:
    templates: [KotlinSharedApplication]
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: macos
        excludes:
          - Info.plist
          - FlareDo.entitlements
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: macos/FlareDo.entitlements
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../apple-shared/build/bin/macosArm64/$(KOTLIN_FRAMEWORK_VARIANT)"
        INFOPLIST_FILE: macos/Info.plist
        OTHER_LDFLAGS: "$(inherited) -lsqlite3 -ObjC -framework KotlinSharedUI"

schemes:
  iOS:
    build:
      targets:
        iOS: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  macOS:
    build:
      targets:
        macOS: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
